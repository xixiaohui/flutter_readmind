name: flutter_readmind
description: ReadMind - Read. Highlight. Share.
publish_to: 'none'
version: 2026.07.09+1783585475

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Database
  drift: ^2.23.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.3.2

  # Network & Connectivity
  connectivity_plus: ^7.2.0

  # File Import
  file_picker: ^12.0.0-beta.7

  # EPUB Reader
  epub_view: ^3.2.0

  # PDF Reader
  pdfx: ^2.5.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Sharing & Export
  share_plus: ^13.2.0
  gal: ^2.3.0

  # Monetization
  in_app_purchase: ^3.1.7

  # # Firebase (Analytics & Crashlytics)
  # firebase_core: ^3.8.0
  # firebase_analytics: ^11.3.3
  # firebase_crashlytics: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.6
  drift_dev: ^2.18.0


flutter:
  uses-material-design: true

  # Disable Swift Package Manager — project already has SPM integrated in pbxproj.
  # Flutter 3.44.x migration fails on `xcodeWorkspace` check before checking if already migrated.
  config:
    enable-swift-package-manager: false

  # Assets
  assets:
    - assets/images/
    - assets/i18n/

  # Fonts
  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf

  # Localizations
  generate: true